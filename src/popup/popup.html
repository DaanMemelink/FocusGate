<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Focus Gate</title>
    <link rel="icon" href="../assets/icons/icon-32.png" />
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <span class="lockup">
      <svg class="mark" viewBox="0 0 32 32" width="18" height="18" fill="currentColor" aria-hidden="true">
        <rect x="4" y="2" width="4.5" height="28"></rect>
        <rect x="23.5" y="2" width="4.5" height="28"></rect>
        <rect x="8.5" y="9" width="15" height="4" fill="var(--accent)"></rect>
        <rect x="8.5" y="19" width="15" height="4"></rect>
      </svg>
      <span>Focus&nbsp;Gate</span>
    </span>

    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="state">…</span>
    </div>
    <p class="detail" id="detail"></p>

    <dl class="mini-tally" id="tally" hidden>
      <div><dt>Cleared today</dt><dd class="tnum" id="cleared">0</dd></div>
      <div><dt>Time granted</dt><dd class="tnum" id="minutes">0 min</dd></div>
    </dl>

    <button class="solid" id="settings" type="button">Open settings</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
